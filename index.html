</header>
</header>

<main style="flex:1;">
  <div class="home-hero" id="homeHero">
    <div class="hero-slide active" style="background-image:url('https://cloudflare-imgbed-94l.pages.dev/file/website/1791784986129_bg_1.jpg'); background-position: 70% 25%;"></div>
    <div class="hero-slide"        style="background-image:url('https://cloudflare-imgbed-94l.pages.dev/file/website/1791784990206_bg_2.jpg');"></div>
    <div class="hero-slide"        style="background-image:url('https://cloudflare-imgbed-94l.pages.dev/file/website/1791784996786_bg_3.jpg');"></div>
    <div class="hero-slide"        style="background-image:url('https://cloudflare-imgbed-94l.pages.dev/file/website/1791785002701_bg_4.jpg'); background-position: 65% 25%;"></div>

    <div class="hero-caption">
    </div>
    <div class="hero-dots" id="heroDots"></div>
  </div>
</main>

<script>
(function() {
  const slides = document.querySelectorAll('.home-hero .hero-slide');
  const dotsBox = document.getElementById('heroDots');
  if (!slides.length) return;
  let current = 0;
  const INTERVAL = 5000;

  slides.forEach((_, i) => {
    const dot = document.createElement('span');
    if (i === 0) dot.classList.add('active');
    dot.addEventListener('click', () => { goTo(i); resetTimer(); });
    dotsBox.appendChild(dot);
  });
  const dots = dotsBox.querySelectorAll('span');

  function goTo(index) {
    slides[current].classList.remove('active');
    dots[current].classList.remove('active');
    current = index;
    slides[current].classList.add('active');
    dots[current].classList.add('active');
  }
  let timer = setInterval(() => goTo((current + 1) % slides.length), INTERVAL);
  function resetTimer() {
    clearInterval(timer);
    timer = setInterval(() => goTo((current + 1) % slides.length), INTERVAL);
  }
})();
</script>

</body>
</html>
