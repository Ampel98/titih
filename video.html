<body>

<header>
  <nav>
    <ul>
      <li><a href="index.html"   class="nav-link">Home</a></li>
      <li><a href="profile.html"     class="nav-link">Profile</a></li>

    </ul>
  </nav>
  <!-- 右上角搜索框 -->
  <form class="nav-search" action="search.html" method="get">
    <svg class="nav-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
    </svg>
    <input type="text" name="q" placeholder="搜索" autocomplete="off">
  </form>
</header>
</header>

<main class="page-content">

  <div class="video-tabs">
    <button class="tab-btn active" data-subtarget="sub-film"    data-tab="film">影视</button>
    <button class="tab-btn" data-subtarget="sub-variety" data-tab="variety">综艺</button>
    <button class="tab-btn" data-subtarget="sub-mv"      data-tab="mv">MV</button>
    <button class="tab-btn" data-subtarget="sub-sns"    data-tab="sns">SNS</button>
    <button class="tab-btn" data-subtarget="sub-live"    data-tab="live">直播</button>
    <button class="tab-btn" data-subtarget="sub-stage"   data-tab="stage">公演</button>
    <button class="tab-btn" data-subtarget="sub-event"   data-tab="event">活动</button>
    <button class="tab-btn" data-subtarget="sub-other"   data-tab="other">其他</button>
  </div>

  <div class="video-content-wrapper">
    <div id="sub-film"    class="video-sub-page active"><div id="film-list-view"></div></div>
    <div id="sub-variety" class="video-sub-page"><div id="variety-list-view"></div></div>
    <div id="sub-mv"      class="video-sub-page"><div id="mv-list-view"></div></div>
    <div id="sub-sns"    class="video-sub-page"><div id="sns-list-view"></div></div>
    <div id="sub-live"    class="video-sub-page"><div id="live-list-view"></div></div>
    <div id="sub-stage"   class="video-sub-page"><div id="stage-list-view"></div></div>
    <div id="sub-event"    class="video-sub-page"><div id="event-list-view"></div></div>
    <div id="sub-other"   class="video-sub-page"><div id="other-list-view"></div></div>
  </div>

</main>

<script src="data.js"></script>
